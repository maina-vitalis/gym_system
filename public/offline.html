<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Offline - Tumaini Fitness</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
      }

      .container {
        text-align: center;
        padding: 2rem;
        max-width: 400px;
      }

      .icon {
        width: 80px;
        height: 80px;
        margin: 0 auto 2rem;
        background: rgba(255, 255, 255, 0.2);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 2rem;
      }

      h1 {
        font-size: 2rem;
        margin-bottom: 1rem;
        font-weight: 600;
      }

      p {
        font-size: 1.1rem;
        line-height: 1.6;
        margin-bottom: 2rem;
        opacity: 0.9;
      }

      .retry-btn {
        background: rgba(255, 255, 255, 0.2);
        border: 2px solid rgba(255, 255, 255, 0.3);
        color: white;
        padding: 12px 24px;
        border-radius: 8px;
        font-size: 1rem;
        cursor: pointer;
        transition: all 0.3s ease;
      }

      .retry-btn:hover {
        background: rgba(255, 255, 255, 0.3);
        border-color: rgba(255, 255, 255, 0.5);
      }

      .features {
        margin-top: 2rem;
        text-align: left;
      }

      .feature {
        display: flex;
        align-items: center;
        margin-bottom: 0.5rem;
        font-size: 0.9rem;
        opacity: 0.8;
      }

      .feature::before {
        content: "✓";
        margin-right: 0.5rem;
        color: #4ade80;
        font-weight: bold;
      }

      @media (prefers-color-scheme: dark) {
        body {
          background: linear-gradient(135deg, #1e293b 0%, #334155 100%);
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="icon">🏋️</div>
      <h1>You're Offline</h1>
      <p>
        Don't worry! Tumaini Fitness works offline too. Some features may be
        limited, but you can still access your dashboard.
      </p>

      <button class="retry-btn" onclick="window.location.reload()">
        Try Again
      </button>

      <div class="features">
        <div class="feature">View cached member data</div>
        <div class="feature">Access membership plans</div>
        <div class="feature">Browse payment history</div>
      </div>
    </div>

    <script>
      // Auto-retry when online
      window.addEventListener("online", () => {
        window.location.reload();
      });

      // Check connection periodically
      setInterval(() => {
        if (navigator.onLine) {
          window.location.reload();
        }
      }, 30000); // Check every 30 seconds
    </script>
  </body>
</html>
